<div id="cv-align-explainer">
  <style>
    #cv-align-explainer {
      color: var(--foreground);
      font: 14px/1.35 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 820px;
    }
    #cv-align-explainer .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    #cv-align-explainer button {
      color: var(--foreground);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      cursor: pointer;
    }
    #cv-align-explainer button[aria-pressed="true"] {
      background: var(--secondary);
      font-weight: 650;
    }
    #cv-align-explainer .status {
      min-height: 20px;
      margin-bottom: 12px;
      font-weight: 650;
    }
    #cv-align-explainer .row {
      display: grid;
      grid-template-columns: 62px repeat(12, minmax(22px, 1fr));
      gap: 3px;
      align-items: center;
      margin: 7px 0;
    }
    #cv-align-explainer .label {
      font-weight: 700;
    }
    #cv-align-explainer .cell {
      height: 34px;
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      position: relative;
      opacity: .28;
      border-radius: 4px;
    }
    #cv-align-explainer .cell.selected { opacity: 1; }
    #cv-align-explainer .cell.feature::after {
      content: "●";
      font-size: 18px;
    }
    #cv-align-explainer .r.feature::after { color: var(--viz-series-1); }
    #cv-align-explainer .g.feature::after { color: var(--viz-series-2); }
    #cv-align-explainer .b.feature::after { color: var(--viz-series-3); }
    #cv-align-explainer .index {
      color: var(--muted-foreground);
      font-size: 10px;
      position: absolute;
      left: 3px;
      top: 1px;
    }
    #cv-align-explainer .result {
      display: none;
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    #cv-align-explainer .result.visible { display: block; }
    #cv-align-explainer .result .row {
      grid-template-columns: 62px repeat(7, minmax(28px, 1fr));
    }
    #cv-align-explainer .rgb {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 62px repeat(7, minmax(28px, 1fr));
      gap: 3px;
      align-items: center;
    }
    #cv-align-explainer .rgb-cell {
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: color-mix(in srgb, var(--foreground) 8%, transparent);
      position: relative;
    }
    #cv-align-explainer .rgb-cell.feature {
      background: linear-gradient(135deg, var(--viz-series-1), var(--viz-series-2), var(--viz-series-3));
    }
    @media (max-width: 560px) {
      #cv-align-explainer { font-size: 12px; }
      #cv-align-explainer .row { grid-template-columns: 42px repeat(12, minmax(15px, 1fr)); gap: 2px; }
      #cv-align-explainer .cell { height: 29px; }
      #cv-align-explainer .result .row,
      #cv-align-explainer .rgb { grid-template-columns: 42px repeat(7, minmax(20px, 1fr)); }
    }
  </style>
  <div class="controls" role="group" aria-label="Этап совмещения">
    <button type="button" data-step="1" aria-pressed="true">1. До совмещения</button>
    <button type="button" data-step="2" aria-pressed="false">2. Общее пересечение</button>
    <button type="button" data-step="3" aria-pressed="false">3. RGB-результат</button>
  </div>
  <div class="status" aria-live="polite"></div>
  <div class="source"></div>
  <div class="result"></div>
  <script>
    (() => {
      const root = document.getElementById('cv-align-explainer');
      const source = root.querySelector('.source');
      const result = root.querySelector('.result');
      const status = root.querySelector('.status');
      const channels = [
        { label: 'Red', cls: 'r', feature: 2, selected: [0, 7] },
        { label: 'Green', cls: 'g', feature: 5, selected: [3, 10] },
        { label: 'Blue', cls: 'b', feature: 7, selected: [5, 12] }
      ];

      function rowMarkup(ch, aligned = false) {
        const length = aligned ? 7 : 12;
        let cells = '';
        for (let i = 0; i < length; i++) {
          const sourceIndex = aligned ? ch.selected[0] + i : i;
          const isFeature = sourceIndex === ch.feature;
          const isSelected = aligned || (sourceIndex >= ch.selected[0] && sourceIndex < ch.selected[1]);
          cells += `<div class="cell ${ch.cls} ${isFeature ? 'feature' : ''} ${isSelected ? 'selected' : ''}"><span class="index">${sourceIndex}</span></div>`;
        }
        return `<div class="row"><div class="label">${ch.label}</div>${cells}</div>`;
      }

      source.innerHTML = channels.map(ch => rowMarkup(ch)).join('');
      result.innerHTML = channels.map(ch => rowMarkup(ch, true)).join('') +
        `<div class="rgb"><div class="label">RGB</div>${Array.from({length: 7}, (_, i) => `<div class="rgb-cell ${i === 2 ? 'feature' : ''}"></div>`).join('')}</div>`;

      function setStep(step) {
        root.querySelectorAll('button[data-step]').forEach(button => {
          button.setAttribute('aria-pressed', String(Number(button.dataset.step) === step));
        });
        source.querySelectorAll('.cell').forEach(cell => {
          cell.style.opacity = step === 1 ? '1' : '';
        });
        result.classList.toggle('visible', step === 3);
        status.textContent = step === 1
          ? 'Одна точка сцены: R[2], G[5], B[7]'
          : step === 2
            ? 'Общая область: R[0:7], G[3:10], B[5:12]'
            : 'После срезов точка имеет индекс 2 во всех трёх каналах';
      }

      root.querySelectorAll('button[data-step]').forEach(button => {
        button.addEventListener('click', () => setStep(Number(button.dataset.step)));
      });
      setStep(1);
    })();
  </script>
</div>
